<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotori's Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="homepage.css">
</head>
<body>
    <div id="bg-layer"></div>
    <div id="ambient-layer" aria-hidden="true"></div>

    <main class="home-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Kotori's personal gate</p>
                <h1>Kotori's Homepage</h1>
            </div>
            <div class="top-actions">
                <button id="bg-view-btn" class="icon-btn" title="观赏背景" aria-label="观赏背景">🖼</button>
                <button id="settings-btn" class="icon-btn" title="背景与音乐设置" aria-label="背景与音乐设置">⚙</button>
            </div>
        </header>

        <section class="hero-grid">
            <div class="profile-panel">
                <div class="profile-heading">
                    <span class="profile-mark">ことり</span>
                </div>
                <article id="profile-rendered" class="profile-content"></article>
            </div>

            <aside class="gate-panel">
                <img class="gate-logo" src="assets/colorful-seika-logo.png" alt="Kotori's Colorful Seika logo">
                <div class="gate-copy">
                    <div class="seal">Colorful Seika</div>
                    <h2>Kotori's Colorful Seika</h2>
                    <p>学习笔记、任务、学科整理和内部入口都在这里。</p>
                </div>
                <button id="enter-space-btn" class="primary-btn">进入主站</button>
                <div id="locked-message" class="locked-message" hidden>请先从 Homepage 输入口令进入主站。</div>
            </aside>
        </section>

        <section class="link-strip" aria-label="外部链接">
            <a id="link-bangumi" class="link-card" target="_blank" rel="noreferrer" aria-label="Bangumi">
                <span class="link-icon">番</span>
                <strong>Bangumi</strong>
            </a>
            <a id="link-github" class="link-card" target="_blank" rel="noreferrer" aria-label="GitHub">
                <span class="link-icon github-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img"><path d="M12 .5A11.5 11.5 0 0 0 8.36 22.9c.58.11.79-.25.79-.56v-2.02c-3.22.7-3.9-1.39-3.9-1.39-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.2 1.77 1.2 1.04 1.77 2.72 1.26 3.38.96.11-.75.41-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.72 0-1.26.45-2.3 1.19-3.11-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.17 1.19A10.98 10.98 0 0 1 12 6.04c.98 0 1.96.13 2.88.39 2.2-1.5 3.17-1.19 3.17-1.19.63 1.59.23 2.77.11 3.06.74.81 1.19 1.85 1.19 3.11 0 4.45-2.71 5.42-5.29 5.71.42.36.79 1.07.79 2.16v3.06c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
                </span>
                <strong>GitHub</strong>
            </a>
            <a id="link-x" class="link-card" target="_blank" rel="noreferrer" aria-label="X">
                <span class="link-icon">𝕏</span>
                <strong>X</strong>
            </a>
            <a id="link-email" class="link-card" aria-label="QQ Mail">
                <span class="link-icon">✉</span>
                <strong>QQ Mail</strong>
            </a>
        </section>

        <section class="music-dock">
            <div class="section-title">Music</div>
            <div id="music-container" class="music-container"></div>
        </section>
    </main>

    <div id="password-modal" class="modal" aria-hidden="true">
        <div class="modal-overlay"></div>
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2>进入 Kotori's Colorful Seika</h2>
                <button class="modal-close" data-close-password aria-label="关闭">×</button>
            </div>
            <div class="modal-body">
                <input id="space-password-input" class="text-input" type="password" placeholder="Password" autocomplete="current-password">
                <button id="password-submit-btn" class="primary-btn full">确认进入</button>
                <p id="password-hint" class="form-hint"></p>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal" aria-hidden="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>背景与音乐设置</h2>
                <button class="modal-close" data-close-settings aria-label="关闭">×</button>
            </div>
            <div class="modal-body settings-layout">
                <section class="settings-block wide">
                    <h3>背景图片</h3>
                    <div class="inline-row">
                        <input type="file" id="bg-upload" accept="image/*" multiple hidden>
                        <button id="bg-upload-btn" class="soft-btn">上传图片</button>
                        <button id="bg-reset-btn" class="soft-btn">默认背景</button>
                    </div>
                    <div id="bg-preview-list" class="bg-preview-list"></div>
                </section>

                <section class="settings-block wide">
                    <h3>网易云音乐</h3>
                    <div class="inline-row stretch-row">
                        <input id="music-input" class="text-input" type="text" placeholder="歌曲链接或 ID">
                        <button id="music-add-btn" class="soft-btn">添加</button>
                    </div>
                    <div id="music-manage-list" class="music-manage-list"></div>
                </section>
            </div>
        </div>
    </div>

    <button class="bg-view-exit" id="bg-view-exit">退出观赏</button>
    <script src="homepage.js?v=20260708-layout-scroll"></script>
</body>
</html>
